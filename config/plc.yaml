# =============================================================================
# 공정 PLC 접속 프로파일 (Mitsubishi MELSEC MC/SLMP)
# -----------------------------------------------------------------------------
# 실제 데이터 경로는 `현대 로봇 <-> 공정 PLC <-> Jetson` 이다.
# Jetson은 로봇 컨트롤러나 PLC를 대체하지 않고, PLC가 래더에서 D 디바이스로
# 미러링한 로봇 상태를 읽고 PLC에 "요청"만 기록한다.
#
# 192.168.10.30:9000에서 MC 3E Binary 읽기는 현장 확인했다.
# 다만 D 레지스터의 의미와 축 scale/dir/offset은 아직 교정 전이므로
# commissioned=false를 유지한다. 이 상태에서도 읽기 전용 RViz 확인은
# 가능하지만, commands_enabled/start_enabled를 절대 올리지 않는다.
# =============================================================================

schema_version: 1

profiles:
  field:
    commissioned: false           # 주소/단위/축 부호/영점 FAT 완료 전에는 false
    commands_enabled: false       # legacy D2000/D3000 경로는 계속 잠금
    start_enabled: false          # 운전 요청은 별도 현장 승인 후 마지막에 true
    poll_hz: 20.0
    status_publish_hz: 20.0
    stale_timeout_ms: 500
    verify_timeout_s: 2.0
    allowed_speed_percent: [25, 50, 75, 100]
    connection:
      host: "192.168.10.30"       # 현장 ping/ARP 확인됨 (2026-08-18)
      port: 9000                   # 현장 MC 3E Binary batch-read 확인 (2026-08-18)
      source_address: "192.168.10.61" # Jetson eno1 영구 고정 IP (2026-08-18 적용)
      frame: "3E"                 # QnUCPU=3E, iQ-R=4E (CPU 확인 필요)
      protocol: "binary"          # PLC Open Setting의 binary/ascii와 일치
      network_no: 0x00
      pc_no: 0xFF
      io_no: 0x03FF
      station_no: 0x00
      monitor_timer_250ms: 16
      connect_timeout_s: 3.0
      read_timeout_s: 1.0
      reconnect_backoff_s: [0.5, 1.0, 2.0, 5.0]

  sim:
    commissioned: true
    commands_enabled: true
    start_enabled: true
    poll_hz: 20.0
    status_publish_hz: 20.0
    stale_timeout_ms: 500
    verify_timeout_s: 1.0
    allowed_speed_percent: [25, 50, 75, 100]
    connection:
      host: "127.0.0.1"
      port: 5010
      source_address: null
      frame: "3E"
      protocol: "binary"
      network_no: 0x00
      pc_no: 0xFF
      io_no: 0x03FF
      station_no: 0x00
      monitor_timer_250ms: 16
      connect_timeout_s: 1.0
      read_timeout_s: 0.5
      reconnect_backoff_s: [0.3, 0.6, 1.0]

# 통신 두절 때 Jetson이 같은 끊어진 Ethernet 경로로 로봇을 정지시킬 수는 없다.
# 아래 값은 ROS 상태를 stale/unknown으로 만드는 시간 기준일 뿐이다. 실제 정지는
# PLC 래더 워치독과 안전회로가 담당해야 한다.
safety:
  stale_timeout_ms: 500
  fail_safe_state: "unknown"
