# ============================================================================
#  네트워크 배치 — IP · 게이트웨이 · 도메인
#  ---------------------------------------------------------------------------
#  카메라망 / ROS 2 통신망 / 제어망을 물리적으로 분리한다.
#  PLC 는 제어망에만 붙으며, 카메라 트래픽(대당 ~1.5 Gbps)과 절대 섞지 않는다.
# ============================================================================

segments:

  hi6_control:                     # Jetson ↔ Hi6 전용 OT 망 (직결 구성)
    subnet: "192.168.250.0/24"
    netmask: "255.255.255.0"
    gateway: null                  # 이 NIC 에 default route 를 만들지 않는다
    dns: []
    forwarding: false              # Wi-Fi/VPN 쪽으로 라우팅·NAT 금지
    hosts:
      jetson:          "192.168.250.10"
    note: "로봇별 IP는 hi6.yaml instances에서만 관리. 한 USB-GbE + 산업용 스위치 사용"

  control:                         # 운영 제어망 — 공정 PLC ↔ Jetson
    subnet: "192.168.10.0/24"
    netmask: "255.255.255.0"
    gateway: null                  # 격리망: default route/DNS를 만들지 않음
    vlan: null
    hosts:
      plc:            "192.168.10.30"   # 현장 확인값, ping 정상
      host_agx:       "192.168.10.61"   # eno1에 영구 적용
    mc_port: 9000                    # 현장 MC 3E Binary batch-read 확인값
    note: "Jetson은 20 Hz로 poll하며 PLC/로봇 원천 갱신보다 빠르면 동일 sample이 반복될 수 있음"

  ros2:                            # ROS 2 통신망 — Edge ↔ Host
    subnet: "192.168.0.0/24"
    hosts:
      edge1: "192.168.0.51"
      edge2: "192.168.0.52"
      edge3: "192.168.0.53"
      host:  "192.168.0.61"

  camera:                          # 카메라 전용 — Edge 별 전용 포트
    note: "센서 ↔ Edge 1:1 직결(USB) 이므로 IP 미할당. GbE 센서로 전환 시 별도 서브넷 부여"

ros2:
  domain_id: 42
  rmw: "rmw_fastrtps_cpp"
  # DDS 를 제어망 인터페이스에만 묶어 카메라망으로 새는 것을 막는다
  restrict_to_interface: true
  interface_hint: "192.168.0.0/24"

# ============================================================================
#  방화벽 / 포트
# ============================================================================

ports:
  - { name: "Hi6 OpenAPI",             proto: tcp, port: 8888,  direction: "Jetson → Hi6" }
  - { name: "Hi6 socket Stream",       proto: tcp, port: 49000, direction: "Jetson → Hi6 (선택)" }
  - { name: "MC protocol (PLC)",     proto: tcp, port: 9000,  direction: "Jetson → PLC" }
  - { name: "MC protocol (sim)",     proto: tcp, port: 5010,  direction: "Host → 내부" }
  - { name: "ROS-TCP-Endpoint",      proto: tcp, port: 10000, direction: "Unity → Host" }
  - { name: "DDS discovery",         proto: udp, port: 7400,  direction: "내부망 전체" }
  - { name: "DDS user traffic",      proto: udp, port: "7410-7460", direction: "내부망 전체" }

# ============================================================================
#  연결 점검 순서 (docs/02_plc_setup.md 와 대응)
# ============================================================================

checklist:
  - "1. PC ↔ PLC 물리 결선 · 링크 LED 확인"
  - "2. ip route get 192.168.10.30 → eno1/src 192.168.10.61 확인"
  - "3. ping 192.168.10.30 응답 확인 (2026-08-18 통과)"
  - "4. PLC TCP 9000 및 MC 3E Binary Open Setting 확인"
  - "5. tools/plc_probe.py --host 192.168.10.30 --port 9000 --dump D1000 21"
  - "6. ros2 launch robot_bridge robot_system.launch.py sim:=false debug:=true"
  - "7. ros2 topic hz /robot/loading/pose → 약 20 Hz 확인"
  - "8. Unity 재생 → 관절 6축이 실로봇과 동일하게 움직이는지 육안 확인"
